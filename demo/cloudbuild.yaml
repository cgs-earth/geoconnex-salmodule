# Manually triggered harvest + deploy. There is deliberately no trigger
# resource and no schedule wired to this in Terraform: run it by hand
# whenever you want fresher geoconnex data, with:
#
#   gcloud builds submit . --config=demo/cloudbuild.yaml \
#     --service-account=projects/<project>/serviceAccounts/<sal-builder email, see terraform output> \
#     --substitutions=_SAL_PROJECT_REPO=<your SAL project repo URL>,_AR_IMAGE=...,_SERVICE_NAME=...,_REGION=...
#
# (the terraform output "build_command" prints this with every substitution
# except _SAL_PROJECT_REPO already filled in from your tfvars)
steps:
  # Clones the existing SAL project repo (the one that declares the
  # JsonLdHarvester task instance with your ~10 sitemap ids) and builds it —
  # which runs geoconnex-salmodule's container on the docker daemon Cloud
  # Build steps are given at /var/run/docker.sock, exactly like running
  # `sal build` on a laptop with Docker installed. No `sal upload` here:
  # nothing queries the data from GCS, Cloud Run serves the copy baked
  # into the image in the next step, so uploading a second copy nothing
  # reads would just be a standing cost with no consumer.
  - name: ghcr.io/cgs-earth/sal:latest
    id: Harvest
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        cd /workspace
        git clone --depth 1 "${_SAL_PROJECT_REPO}" project
        cd project
        /app/sal build "${_SAL_BUILD_PATH}"

  # Bakes the project this step just built (including .sal/data, still
  # sitting in /workspace/project from the step above) into a serving
  # image, so a Cloud Run cold start has everything on local disk already
  # and never has to reach GCS, Docker, or GitHub at request time.
  - name: docker:28-cli
    id: Bake serve image
    entrypoint: sh
    args:
      - -c
      - |
        set -e
        docker build -t "${_AR_IMAGE}:$BUILD_ID" -f demo/Dockerfile .
        docker push "${_AR_IMAGE}:$BUILD_ID"

  # --min-instances=0 is passed explicitly rather than left to inherit from
  # the previous revision, so this deploy can never accidentally pin a warm
  # instance: every deploy re-asserts scale-to-zero on its own, regardless
  # of what any earlier manual `gcloud run deploy` happened to set.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: Deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_AR_IMAGE}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --min-instances=0
      - --max-instances=${_MAX_INSTANCES}
      - --quiet

substitutions:
  _SAL_BUILD_PATH: data/
  _MAX_INSTANCES: "3"

options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
